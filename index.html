            <div 
                x-data="{
                    pile: '',
                    east: '',
                    west: '',
            
                    code_cast: '',
                    code_main: '',
                    code_sway: '',

                    main: '',
                    sway: '',

                    muta: false,
            
                    init() {    
                        let arr = [];
                        
                        for (let i = 0; i < 6; i++) {
                            arr.push(this.lineCast());
                        }
            
                        this.setData(arr.join(''));
                    },
            
                    setData(arr) {
            
                        this.code_cast = arr;
            
                        let castOpts = { 6: 7, 7: 7, 8: 8, 9: 8 };
            
                        let sway_cast = this.code_cast.replace(/[6789]/g, (m) => castOpts[m]);
            
                        let hexagramOpts = { 6: 0, 7: 1, 8: 0, 9: 1 };
            
                        this.code_main = this.code_cast.replace(/[6789]/g, (m) => hexagramOpts[m]);
                        this.code_sway = sway_cast.replace(/[6789]/g, (m) => hexagramOpts[m]);  

                        this.main = this.hexagram(this.code_main);
                        this.sway = this.hexagram(this.code_sway);

                        if(this.main === this.sway) { 
                            this.muta = false; 
                        } else { 
                            this.muta = true; 
                        }
                        
                    },
            
                    divideStalks(yarrowStalks) {
                        let westPile = Math.floor(Math.random() * yarrowStalks + 1);
                        let eastPile = yarrowStalks - westPile;
            
                        westPile = westPile - 1;
            
                        this.east = eastPile % 4;
                        this.west = westPile % 4;
            
                        if (this.east === 0) {
                            this.east = 4;
                        }
            
                        if (this.west === 0) {
                            this.west = 4;
                        }
                        this.pile = this.east + this.west + 1;
                    },
            
                    lineCast() {
                        let stalks = 49;
                        let countValueOne = 0;
                        let countValueTwo = 0;
                        let countValueThree = 0;
            
                        this.divideStalks(stalks);
                        if (this.east + this.west + 1 === 9) {
                            countValueOne = 2;
                        }
                        if (this.east + this.west + 1 === 5) {
                            countValueOne = 3;
                        }
            
                        stalks = stalks - this.pile;
            
                        this.divideStalks(stalks);
            
                        if (this.east + this.west + 1 === 8) {
                            countValueTwo = 2;
                        }
            
                        if (this.east + this.west + 1 === 4) {
                            countValueTwo = 3;
                        }
            
                        stalks = stalks - this.pile;
            
                        this.divideStalks(stalks);
            
                        if (this.east + this.west + 1 === 8) {
                            countValueThree = 2;
                        }
            
                        if (this.east + this.west + 1 === 4) {
                            countValueThree = 3;
                        }
            
                        let lineValue = countValueOne + countValueTwo + countValueThree;
            
                        return lineValue;
                    },
                    hexagram($code)
                    {
                        switch($code) {
                            case('111111'):  return '1'; break;
                            case('000000'):  return '2'; break;
                            case('100010'):  return '3'; break;
                            case('010001'):  return '4'; break;
                            case('111010'):  return '5'; break;
                            case('010111'):  return '6'; break;
                            case('010000'):  return '7'; break;
                            case('000010'):  return '8'; break;
                            case('111011'):  return '9'; break;

                        };
